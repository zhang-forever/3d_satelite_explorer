name: Publish static mirror

on:
  push:
    branches: [main]
    paths:
      - app/**
      - components/**
      - lib/**
      - public/**
      - scripts/*static*.mjs
      - tests/static-data.test.ts
      - next.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NEXT_PUBLIC_DATA_MODE: snapshot
      NEXT_PUBLIC_SNAPSHOT_GROUPS: active,stations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check Pages is enabled
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Restore data and upstream rejection state
        uses: actions/cache/restore@v4
        with:
          path: .cache/static-data
          key: ${{ runner.os }}-orbital-gp-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-orbital-gp-v1-
      - name: Verify snapshot retention and failure behavior
        run: node node_modules/vitest/vitest.mjs run tests/static-data.test.ts
      - name: Update selected orbital snapshots
        run: node scripts/update-static-data.mjs
      - name: Retain data state even when an update fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/static-data
          key: ${{ runner.os }}-orbital-gp-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build independent static website
        run: node scripts/build-static.mjs
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
          retention-days: 1
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
